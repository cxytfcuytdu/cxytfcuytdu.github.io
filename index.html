<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>课表</title><style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg,#7aa7ff);color:#fff}
.wrap{max-width:430px;margin:auto;padding:16px}.glass{backdrop-filter:blur(18px);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.2);border-radius:24px;padding:16px;margin:12px 0}
button,select{border:0;border-radius:14px;padding:10px 14px}.dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(18px);padding:10px;border-radius:24px}
.hidden{display:none}
</style><body><div class=wrap>
<div class=glass><h2 id=t></h2><div id=d></div></div>
<div class=glass><b id=lab>今日课程</b><ol id=list></ol></div>
<div class="glass hidden" id=set><h3>设置</h3>背景<select id=bg><option>#7aa7ff</option><option>#6bcf8f</option><option>#ff9fb2</option><option>#666</option></select><br><label><input type=checkbox id=widget checked> 显示课程</label></div>
</div><div class=dock><button onclick="show('today')">今日</button><button onclick="show('tom')">明日</button><button onclick="day(-1)">◀</button><button onclick="day(1)">▶</button><button onclick="set.classList.toggle('hidden')">设置</button></div>
<script>
const tb={1:["物理","数学","地理","语文","英语","生物","体育"],2:["英语","数学","历史","物理","德法","语文","信息"],3:["数学","英语","物理","语文","地理","数学","美术"],4:["语文","英语","体育","德法","数学","生物","物理"],5:["语文","数学","体育","英语","音乐","历史","班心"]};
let off=0;
function render(){let n=new Date(),w=((n.getDay()+6)%7)+1+off;if(w<1)w=5;if(w>5)w=1;let a=tb[w]||[];list.innerHTML=a.map(x=>"<li>"+x+"</li>").join("");lab.textContent=["","星期一","星期二","星期三","星期四","星期五"][w]+"课程";t.textContent=n.toLocaleTimeString();d.textContent=n.toLocaleDateString();}
setInterval(render,1000);render();
function show(x){off=x=="today"?0:1;render()}
function day(v){off+=v;render()}
bg.value=localStorage.bg||"#7aa7ff";document.body.style.setProperty("--bg",bg.value);
bg.onchange=()=>{document.body.style.setProperty("--bg",bg.value);localStorage.bg=bg.value}
widget.checked=localStorage.widget!="0";function uw(){document.querySelectorAll('.glass')[1].style.display=widget.checked?'block':'none';localStorage.widget=widget.checked?1:0}widget.onchange=uw;uw();
</script></body></html>
